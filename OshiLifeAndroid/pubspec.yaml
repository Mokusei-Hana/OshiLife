name: oshilife
description: "OshiLife Android companion app. The iOS SwiftUI app in this repository is the reference implementation; this Flutter app mirrors its features and design language (see docs/FLUTTER_MIGRATION_PLAN.md)."
publish_to: "none"

# Keep the marketing version (before +) aligned with the iOS
# MARKETING_VERSION by convention; the build number is independent.
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  drift: ^2.28.0
  drift_flutter: ^0.2.4
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  image: ^4.3.0
  intl: any
  path_provider: ^2.1.4
  shared_preferences: ^2.5.0
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.0
  http: ^1.6.0
  html_unescape: ^2.0.0
  charset: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
